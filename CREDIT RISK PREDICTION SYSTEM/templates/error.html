<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Process Error | FinGuard Security</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --bg-dark: #020617;
            --card-glass: rgba(255, 255, 255, 0.03);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-dark);
            background-image:
                radial-gradient(circle at 10% 20%, rgba(239, 68, 68, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(79, 70, 229, 0.08) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2.5rem;
        }

        .error-card {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-glass);
            padding: 4rem 3.5rem;
            border-radius: 40px;
            backdrop-filter: blur(25px);
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.8);
            text-align: center;
            max-width: 520px;
            width: 100%;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-container {
            width: 90px;
            height: 90px;
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2.5rem;
            box-shadow: 0 0 40px rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.2);
            transform: rotate(-5deg);
        }

        h1 {
            color: white;
            font-size: 2.25rem;
            font-weight: 800;
            margin-bottom: 1rem;
            letter-spacing: -0.04em;
        }

        p {
            color: var(--text-dim);
            line-height: 1.7;
            margin-bottom: 3rem;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .btn-retry {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            text-decoration: none;
            padding: 1.25rem;
            border-radius: 18px;
            font-weight: 800;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            margin-bottom: 1.25rem;
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn-retry:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px -5px rgba(79, 70, 229, 0.5);
            filter: brightness(1.1);
        }

        .details-box {
            margin-top: 2.5rem;
            background: rgba(255, 255, 255, 0.03);
            padding: 1.5rem;
            border-radius: 20px;
            border: 1px solid var(--border-glass);
            text-align: left;
        }

        .details-label {
            color: var(--danger);
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.75rem;
            display: block;
            margin-bottom: 8px;
            letter-spacing: 0.1em;
        }

        .details-text {
            color: var(--text-dim);
            font-size: 0.95rem;
            line-height: 1.6;
            font-family: 'Monaco', 'Consolas', monospace;
        }

        .support-link {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s;
            padding: 10px 20px;
            border-radius: 12px;
            display: inline-block;
        }

        .support-link:hover {
            color: white;
            background: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

<body>

    <div class="error-card">
        <div class="icon-container">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        </div>
        <h1>Process Interrupted</h1>
        <p>The system encountered a security or validation inconsistency while processing your request.</p>

        <a href="javascript:history.back()" class="btn-retry">Return & Re-Authorize</a>

        <div class="details-box">
            <span class="details-label">Exception Signature</span>
            <div class="details-text">
                {{ message }}
            </div>
        </div>

        <div style="margin-top: 2.5rem;">
            <a href="/user_dashboard" class="support-link">Return to Operational Dashboard</a>
        </div>
    </div>

</body>

</html>
