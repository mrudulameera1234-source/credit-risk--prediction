<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Command Center | FinGuard Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --bg-dark: #020617;
            --card-glass: rgba(255, 255, 255, 0.03);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-dark);
            background-image:
                radial-gradient(circle at 10% 10%, rgba(79, 70, 229, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(79, 70, 229, 0.1) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .login-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--border-glass);
            padding: 4rem 3.5rem;
            border-radius: 32px;
            width: 100%;
            max-width: 460px;
            backdrop-filter: blur(25px);
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.9);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .login-card::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--primary-light), var(--primary));
            background-size: 200% 100%;
            animation: moveGradient 3s linear infinite;
        }

        @keyframes moveGradient {
            0% {
                background-position: 0% 50%;
            }

            100% {
                background-position: 200% 50%;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 3.5rem;
        }

        .logo-box {
            width: 64px;
            height: 64px;
            background: var(--primary);
            border-radius: 20px;
            margin: 0 auto 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(79, 70, 229, 0.4);
            transform: rotate(45deg);
        }

        .logo-box svg {
            transform: rotate(-45deg);
        }

        .header h2 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 0.75rem;
            color: white;
        }

        .header p {
            color: var(--text-dim);
            font-size: 1rem;
            font-weight: 500;
        }

        .error-alert {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            padding: 1.25rem;
            border-radius: 16px;
            margin-bottom: 2.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
            border-left: 5px solid #ef4444;
        }

        .form-group {
            margin-bottom: 2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-left: 4px;
        }

        .input-field {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            padding: 1.25rem;
            border-radius: 16px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-field:focus {
            outline: none;
            border-color: var(--primary-light);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 1.25rem;
            background: linear-gradient(135deg, var(--primary) 0%, #312e81 100%);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            box-shadow: 0 10px 30px -10px rgba(79, 70, 229, 0.5);
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px -10px rgba(79, 70, 229, 0.6);
            filter: brightness(1.1);
        }

        .footer {
            margin-top: 3.5rem;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 700;
        }

        .shield-icon {
            margin-bottom: 12px;
            color: var(--primary-light);
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="header">
            <div class="logo-box">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
            </div>
            <h2>Admin Gateway</h2>
            <p>Authorized personnel only</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, msg in messages %}
        <div class="error-alert">{{ msg }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" id="adminForm" autocomplete="off">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label>System Administrator ID</label>
                <input type="text" id="admin_user" name="username" class="input-field" value="" required
                    autocomplete="off" />
            </div>
            <div class="form-group">
                <label>Authorization Token</label>
                <input type="password" id="admin_pass" name="password" class="input-field" value="" required
                    autocomplete="new-password" />
            </div>
            <button type="submit" class="submit-btn shadow-lg">Authenticate Identity</button>
        </form>

        <script>
            window.onload = function () {
                setTimeout(function () {
                    document.getElementById('admin_user').value = '';
                    document.getElementById('admin_pass').value = '';
                }, 100);
            };
        </script>

        <div class="footer">
            <div class="shield-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"
                    style="display:inline-block; vertical-align:middle; margin-right:4px;">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                Secure Environment
            </div>
            Global Command Center v4.0<br><br>
            <a href="/"
                style="color: var(--primary-light); text-decoration: none; font-size: 0.85rem; font-weight: 600; transition: all 0.3s; opacity: 0.8;"
                onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.8'">
                ← Back to Landing Page
            </a>
        </div>

    </div>

</body>

</html>
